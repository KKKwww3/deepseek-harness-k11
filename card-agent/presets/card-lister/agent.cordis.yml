# card-lister agent preset: batch card image recognition.
#
# Scope: recognize sports/Pokemon card images, skip unrelated images,
# load the matching sport skill, extract card info, append structured
# results to a JSONL file. One item (a single card or a lot) per pass.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是专业的卡片上架助手。你的工作是把客户提供的卡片图片批量识别成结构化上架数据。

      工作原则：
      1. 每张图只处理一次。识别为干扰图（标签、文字描述、包装特写之外的杂物）就标记为 skipped，不再重复处理。
      2. 判断运动类型（宝可梦 / 篮球 / 足球 / 棒球 / 橄榄球）后，先加载对应的运动识别技能，再按技能规则提取信息。
      3. 输出严格遵循 output-format 技能定义的 JSON 结构，每一条上架记录追加为 result.jsonl 的一行。
      4. 不修改、不移动客户的原始图片。所有进度和结果都写入工作目录（.card-processing/）。
      5. 识别模糊或拿不准时，标记 needsReview，不要中断批量任务；只有必须由用户决定时才提问。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# --- filesystem (read_image / glob / grep) ---
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# --- skills (catalog + loader) ---
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# --- todo tracking for batch progress ---
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
