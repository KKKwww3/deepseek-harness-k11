# 受控枚举（单一事实源）
#
# pattern / color 的可选值统一在这里维护。以下位置都以此为基准，改动后必须同步：
#   - refractor-agent/skills/refractor-vlm/SKILL.md 里的内联副本（Agent 会话内可见）
#   - scripts/vlm.py 的 VLM_PROMPT 由本文件程序化生成（不手写）
#   - scripts/embed.py 校验词典 pattern/color 是否落在本枚举内
#
# 约定：
# - 某系列词典里没登记的新图案，VLM 先记 pattern=其他 + 进 review，不编造新词。
# - color=无 表示该图案不区分颜色（如「现在折射 Now」）。
# - pattern=平卡 表示无折射，不算失败，不进 review。

pattern:
  - 银折
  - 碎冰
  - 金折
  - 绿折
  - 橙折
  - 紫折
  - 现在折射
  - 爆金
  - 棋盘
  - 脉冲
  - 平卡
  - 其他

color:
  - 银
  - 金
  - 红
  - 蓝
  - 绿
  - 橙
  - 紫
  - 无
  - 其他
