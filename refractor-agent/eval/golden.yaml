# 金标数据集（员工维护）
#
# 规则见 eval/README.md。每行 case 是「一张卡 + 期望答案」。
# - rec 字段 = 预录的 VLM 结构化识别，供匹配层（--mode match）离线评测；
# - front/back 字段 = 卡片图片路径（相对 images_root），供全链路（--mode live）评测；
# - expected.refraction = null 表示平卡（无折射）。
#
# 种子样例为合成识别结果（便于离线跑通）；真实卡图与真实识别请按需补充，
# 目标是每系列 ≥ 20 条。

images_root: eval/images

