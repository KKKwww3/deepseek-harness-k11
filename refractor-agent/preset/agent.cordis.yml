# The refractor-normalizer agent preset: normalize card-refractor appearance
# into industry-standard names via VLM structured output + vector matching.
#
# AGENT-PLANE composition. The roster mounts it once under a standing scope;
# every session naming it joins by scope parentage. The host composition keeps
# the registries, sandbox/approval stack, persistence, and model route.
#
# 工具集说明：
# - refractor domain tools   本 preset 自带插件（refractor_recognize / match /
#   batch_run / batch_status）：识别、匹配与批处理全部走类型化工具，业务主
#   路径不经过 bash；插件依赖从 refractor-agent/node 向上解析
# - tool-fs                  write（单项流程写结果文件）
# - tool-fs-search           glob/ls（发现图片与客户目录）
# - skill-filesystem + tool-skill   加载 refractor-vlm / refractor-match
# - tool-todo                批量进度追踪
# - tool-ask-user    非问不可时向你确认（默认走 review，不打断批量）

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a trading-card refractor (parallel) normalizer. Your job is to
      turn a card's refractor appearance into the exact industry-standard name
      that customers search for (e.g. 碎冰红 / Red Ice), so listings are found.

      For every card you must: (1) call the refractor_recognize tool with the
      card front and back image paths to get a STRUCTURED recognition: pattern,
      color, brand, series, and a free-text desc of the refractor finish —
      never recognize the refractor yourself from the images; (2) validate the
      tool output against the refractor-vlm skill: the pattern and color MUST
      match the controlled choices in the loaded dict (same pattern + different
      color is a DIFFERENT refraction — never merge them), brand/series must
      come from the back copyright text; (3) call the refractor_match tool with
      that recognition to vector-match the GLOBAL refraction type and resolve
      the series-specific standard term from the database naming table; (4)
      write ONE JSON record per card following the refractor-match skill to the
      output path given in the task.

      For a directory of cards use the refractor_batch_run tool with a customer
      input directory and a work directory — it is durable and resumable; check
      progress with refractor_batch_status. Do NOT process card images through
      bash; there is no shell tool in this preset.

      Never invent a refractor name. If nothing is matched above the threshold,
      mark needsReview instead of guessing. A plain non-parallel card is
      refraction: null and not a failure.

# ── domain tools (preset-carried plugin; absolute row so installed copies keep working) ──

- id: refractor-tools
  name: '/code/sj1/deepseek-harness-k11/refractor-agent/node/dist/refractor-plugin.mjs'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── progress and fallback questions ─────────────────────────────────────────

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'